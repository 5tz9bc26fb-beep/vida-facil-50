<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vida Fácil 50+</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eee;font-family:Arial,sans-serif;color:#30264a}.app{width:min(430px,100vw);min-height:100vh;margin:auto;background:#fff;padding-bottom:76px;box-shadow:0 0 30px #bbb}header{background:linear-gradient(135deg,#7040bb,#aa70e7);color:#fff;padding:24px 19px;border-radius:0 0 28px 28px}.logo{font-size:24px;font-weight:800}.sub{font-size:12px;margin-top:5px;opacity:.95}main{padding:17px}.hello{font-size:21px;font-weight:800;margin-bottom:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.card{border:0;border-radius:18px;padding:16px;min-height:125px;text-align:left;box-shadow:0 4px 14px #ddd;cursor:pointer;color:#30264a}.card b{font-size:16px}.card small{display:block;margin-top:8px;line-height:1.3}.purple{background:#eee2ff}.orange{background:#fff0df}.green{background:#e4f8ed}.blue{background:#e4efff}.voice{margin:15px 0;background:#f5efff;border-radius:17px;padding:13px;display:flex;gap:10px;align-items:center;cursor:pointer}.mic{width:43px;height:43px;border-radius:50%;background:#7040bb;color:#fff;display:grid;place-items:center}.voice span,.muted{display:block;font-size:12px;color:#756a84;line-height:1.4}.section{font-size:21px;font-weight:800;margin:3px 0 14px}.back{border:0;background:#eee2ff;color:#6339a0;padding:9px 13px;border-radius:12px;font-weight:700;cursor:pointer;margin-bottom:12px}.item{background:#faf8fd;border:1px solid #eee;border-radius:16px;padding:14px;margin:9px 0;cursor:pointer}.item b{display:block;margin-bottom:5px}.pill{display:inline-block;background:#eee2ff;color:#6339a0;padding:5px 9px;border-radius:20px;font-size:11px;margin:3px}.post{display:flex;gap:10px}.avatar{width:42px;height:42px;border-radius:50%;background:#d9c2f4;display:grid;place-items:center;font-weight:800;flex:none}.photo{height:115px;border-radius:13px;background:linear-gradient(135deg,#dfc6f6,#f6e8ff);display:grid;place-items:center;font-size:42px;margin-top:10px}.lesson{display:flex;gap:12px;align-items:center}.icon{width:47px;height:47px;border-radius:14px;background:#eee2ff;display:grid;place-items:center;font-size:23px;flex:none}.sos{text-align:center;background:#fff0f0;border:2px solid #e35b65;border-radius:20px;padding:18px}.sos button{width:125px;height:125px;border-radius:50%;border:0;background:#e34f59;color:#fff;font-size:22px;font-weight:800;cursor:pointer}.bottom{position:fixed;bottom:0;width:min(430px,100vw);background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:9px 3px;z-index:5}.bottom button{border:0;background:none;color:#6c607b;font-size:10px;cursor:pointer}.bottom b{display:block;font-size:20px}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:10}.modalbox{width:min(430px,100vw);background:#fff;border-radius:25px 25px 0 0;padding:21px;max-height:80vh;overflow:auto}.modalbox button{background:#7040bb;color:#fff;border:0;border-radius:12px;padding:11px 18px;font-weight:700}input{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;margin:6px 0}
</style></head>
<body><div class="app"><header><div class="logo">💜 Vida Fácil 50+</div><div class="sub">Tecnologia que conecta, orienta, protege e dá autonomia.</div></header><main id="main"></main>
<div class="bottom"><button onclick="home()">⌂<br>Início</button><button onclick="screen('community')">👥<br>Comunidade</button><button onclick="screen('learn')">🎓<br>Aprender</button><button onclick="screen('protection')">🆘<br>Proteção</button><button onclick="screen('settings')">⚙️<br>Ajustes</button></div></div>
<div class="modal" id="modal"><div class="modalbox"><div id="modalText"></div><br><button onclick="closeModal()">Fechar</button></div></div>
<script>
const M=document.getElementById('main');
function modal(t){document.getElementById('modalText').innerHTML=t;document.getElementById('modal').style.display='flex'}
function closeModal(){document.getElementById('modal').style.display='none'}
function title(t){M.innerHTML='<button class="back" onclick="home()">← Voltar</button><div class="section">'+t+'</div>'}
function home(){M.innerHTML=`<div class="hello">Olá, Maria! 👋</div><div class="grid">
<button class="card purple" onclick="screen('life')">🏠 <b>Minha Vida</b><small>Remédios, consultas, documentos e mensagens.</small></button>
<button class="card orange" onclick="screen('community')">🤝 <b>Comunidade 50+</b><small>Amigos, grupos, atividades e eventos.</small></button>
<button class="card green" onclick="screen('learn')">🎓 <b>Aprenda Fácil</b><small>Aprenda tecnologia passo a passo.</small></button>
<button class="card blue" onclick="screen('protection')">🆘 <b>Modo Proteção</b><small>Peça ajuda quando precisar.</small></button></div>
<div class="voice" onclick="screen('voice')"><div class="mic">🎙️</div><div><b>Fale com o Vida Fácil</b><span>Ex.: “Quero ver meus amigos”.</span></div></div>
<div class="item" onclick="screen('trust')">🛡️ <b>Meus Contatos de Confiança</b><span class="muted">Pessoas escolhidas por você.</span></div>
<div class="item" onclick="screen('settings')">🔐 <b>Configurações e Privacidade</b><span class="muted">Controle dados e notificações.</span></div>`}

function screen(s){
if(s==='life'){title('🏠 Minha Vida');M.innerHTML+=`
<div class="item" onclick="screen('reminders')">⏰ <b>Lembretes</b><span class="muted">Ex.: vitamina às 08h e consulta sexta às 14h.</span></div>
<div class="item" onclick="modal('<b>📅 Compromissos</b><p>Hoje: caminhada às 17h.</p><p>Amanhã: mercado às 09h.</p><p>Sábado: aniversário da família.</p>')">📅 <b>Compromissos</b><span class="muted">Exemplos de compromissos pessoais.</span></div>
<div class="item" onclick="modal('<b>📄 Documentos</b><p>Exemplos: RG, CPF, cartão do SUS, comprovantes.</p><span class=pill>Organizar</span><span class=pill>Consultar</span>')">📄 <b>Documentos</b><span class="muted">Referências importantes organizadas.</span></div>
<div class="item" onclick="modal('<b>💬 Mensagens</b><p>Exemplo: “Sua consulta foi remarcada para sexta”.</p><p>O app pode explicar em linguagem simples e ler em voz alta.</p>')">💬 <b>Ajuda com mensagens</b><span class="muted">Entenda textos com mais facilidade.</span></div>`}
else if(s==='reminders'){title('⏰ Lembretes');M.innerHTML+=`
<span class=pill>Todos</span><span class=pill>Remédios</span><span class=pill>Consultas</span><span class=pill>Compromissos</span>
<div class=item onclick="modal('<b>💊 08:00 — Vitamina</b><p>Lembrete pessoal de Maria.</p>')">💊 <b>08:00 — Vitamina</b><span class=muted>Hoje.</span></div>
<div class=item onclick="modal('<b>🩺 Sexta — 14:00</b><p>Consulta agendada.</p><p>O aplicativo apenas lembra o compromisso.</p>')">🩺 <b>Sexta — 14:00</b><span class=muted>Consulta.</span></div>
<div class=item onclick="modal('<b>🚶 17:00 — Caminhada</b><p>Atividade pessoal.</p>')">🚶 <b>17:00 — Caminhada</b><span class=muted>Hoje.</span></div>`}
else if(s==='community'){title('🤝 Comunidade 50+');M.innerHTML+=`
<input placeholder="🔎 Buscar pessoas, grupos ou atividades">
<div class=item onclick="screen('friends')">👥 <b>Amigos</b><span class=muted>Veja pessoas e conheça novos amigos.</span></div>
<div class=item onclick="screen('activities')">🏃 <b>Atividades</b><span class=muted>Encontre coisas para fazer.</span></div>
<div class=item onclick="screen('events')">📅 <b>Eventos</b><span class=muted>Encontros e eventos próximos.</span></div>
<div class=item onclick="screen('croche')">🧶 <b>Artesanato e Crochê</b><span class=muted>Grupo com publicações e ideias.</span></div>
<div class=item onclick="screen('recipes')">🍳 <b>Receitas culinárias</b><span class=muted>Receitas compartilhadas pela comunidade.</span></div>
<div class=item onclick="screen('travel')">✈️ <b>Viagens e Passeios</b><span class=muted>Dicas, roteiros e experiências.</span></div>
<div class=item onclick="screen('books')">📚 <b>Livros</b><span class=muted>Indicações e conversas sobre leitura.</span></div>
<div class=item onclick="modal('<b>📍 Perto de mim</b><p>Ex.: feira de artesanato, caminhada e encontro cultural.</p><p>A localização exata não é pública por padrão.</p>')">📍 <b>Perto de mim</b><span class=muted>Atividades locais.</span></div>`}
else if(s==='friends'){title('👥 Amigos');[['👩','Ana Paula','56 anos • gosta de culinária e viagens'],['👨','João Carlos','61 anos • música e caminhada'],['👩','Maria José','54 anos • crochê e artesanato'],['👨','Carlos Eduardo','59 anos • fotografia e livros']].forEach(x=>M.innerHTML+=`<div class=item onclick="modal('<b>${x[1]}</b><p>${x[2]}</p><span class=pill>Ver perfil</span><span class=pill>Adicionar</span><span class=pill>Conversar</span>')">${x[0]} <b>${x[1]}</b><span class=muted>${x[2]}</span></div>`)}
else if(s==='activities'){title('🏃 Atividades');[['🚶','Caminhada 50+','Hoje • 17h • praça central'],['🧶','Oficina de Crochê','Sábado • 15h • centro comunitário'],['🎨','Pintura e Artes','Quarta • 14h • espaço cultural'],['🎵','Roda de Música','Sexta • 18h • encontro comunitário'],['🌱','Horta Comunitária','Domingo • 08h • atividade ao ar livre']].forEach(x=>M.innerHTML+=`<div class=item onclick="modal('<b>${x[0]} ${x[1]}</b><p>${x[2]}</p><p>Exemplo: participar, ver detalhes e adicionar à agenda.</p>')">${x[0]} <b>${x[1]}</b><span class=muted>${x[2]}</span></div>`)}
else if(s==='events'){title('📅 Eventos');[['🎭','Festival Cultural 50+','13/09 • 16h'],['🎶','Noite da Música','20/09 • 19h'],['🧺','Feira de Artesanato','21/09 • 08h'],['☕','Café da Comunidade','27/09 • 16h']].forEach(x=>M.innerHTML+=`<div class=item onclick="modal('<b>${x[0]} ${x[1]}</b><p>${x[2]}</p><p>Exemplo: ver detalhes, confirmar presença e adicionar à agenda.</p>')">${x[0]} <b>${x[1]}</b><span class=muted>${x[2]}</span></div>`)}
else if(s==='croche'){title('🧶 Artesanato e Crochê');M.innerHTML+=`<div class=item><div class=post><div class=avatar>MS</div><div><b>Maria Silva</b><span class=muted>Hoje, 10:20</span><p>Terminei minha bolsa de crochê! 🧶✨</p><span class=pill>❤️ 24</span><span class=pill>💬 8</span></div></div><div class=photo>🧶</div></div><div class=item onclick="modal('<b>🎤 Publicar</b><p>Exemplo: publicar foto, texto ou áudio mostrando uma peça.</p>')">🎤 <b>Falar / publicar</b><span class=muted>Compartilhe sua criação.</span></div>`}
else if(s==='recipes'){title('🍳 Receitas culinárias');[['🍰','Bolo de milho','Receita caseira da comunidade.'],['🥘','Escondidinho de carne','Passo a passo simples.'],['🍮','Pudim de leite','Ingredientes e preparo.'],['🥗','Salada especial','Opção leve para o almoço.']].forEach(x=>M.innerHTML+=`<div class=item onclick="modal('<b>${x[0]} ${x[1]}</b><p>${x[2]}</p><p><b>Exemplo:</b> ingredientes → preparo → tempo → servir.</p>')">${x[0]} <b>${x[1]}</b><span class=muted>${x[2]}</span></div>`)}
else if(s==='travel'){title('✈️ Viagens e Passeios');[['🏖️','Praia','Dicas de passeio, hospedagem e roteiro.'],['🏞️','Serra e natureza','Trilhas leves e lugares para conhecer.'],['🏛️','Passeio cultural','Museus, centros históricos e cultura local.'],['🚌','Excursões','Ideias de viagens em grupo.']].forEach(x=>M.innerHTML+=`<div class=item onclick="modal('<b>${x[0]} ${x[1]}</b><p>${x[2]}</p><p>Exemplo: roteiro, melhor horário, o que levar e companhia.</p>')">${x[0]} <b>${x[1]}</b><span class=muted>${x[2]}</span></div>`)}
else if(s==='books'){title('📚 Livros');[['📖','O Pequeno Príncipe','Indicação para leitura e conversa.'],['📕','Romance','Sugestões de romances compartilhadas.'],['📗','Histórias reais','Livros sobre experiências de vida.'],['📘','Desenvolvimento pessoal','Leituras para aprender e refletir.']].forEach(x=>M.innerHTML+=`<div class=item onclick="modal('<b>${x[0]} ${x[1]}</b><p>${x[2]}</p><p>Exemplo: ver indicação, comentar e adicionar à lista.</p>')">${x[0]} <b>${x[1]}</b><span class=muted>${x[2]}</span></div>`)}
else if(s==='learn'){title('🎓 Aprenda Fácil');[['📱','WhatsApp','Enviar fotos, áudios e fazer chamadas.'],['💳','Pix com segurança','Conferir destinatário antes de pagar.'],['🛒','Compras online','Verificar site, endereço e reputação.'],['⚠️','Evite golpes','Cuidado com links e pedidos urgentes.'],['📸','Fotos','Tirar, editar e compartilhar fotos.']].forEach(x=>M.innerHTML+=`<div class=item lesson onclick="modal('<b>${x[0]} ${x[1]}</b><p>${x[2]}</p><p><b>Exemplo:</b> Passo 1 → abrir. Passo 2 → escolher. Passo 3 → confirmar.</p>')"><div class=icon>${x[0]}</div><div><b>${x[1]}</b><span class=muted>${x[2]}</span></div></div>`)}
else if(s==='protection'){title('🆘 Modo Proteção');M.innerHTML+=`<div class=sos><p><b>Proteção ativada somente quando você escolher.</b></p><button onclick="modal('<b>🚨 SOS acionado</b><p>Em uma situação real, o protocolo configurado alertaria os contatos autorizados.</p><p>Exemplo: alerta + horário + localização, somente se previamente autorizado.</p>')">SOS</button><p class=muted>Botão manual de emergência</p></div><div class=item onclick="modal('<b>🎙️ Comando de emergência</b><p>Exemplo: “Socorro, preciso de ajuda!”</p><p>O app não fica ouvindo o tempo todo. O reconhecimento funciona quando o Modo Proteção está ativo, conforme permissões do dispositivo.</p>')">🎙️ <b>Comando de voz</b><span class=muted>Ativação por voz.</span></div><div class=item onclick="screen('trust')">👥 <b>Contatos autorizados</b><span class=muted>Escolha quem recebe alertas.</span></div>`}
else if(s==='voice'){title('🎙️ Assistente de Voz');M.innerHTML+=`<div class=voice onclick="modal('<b>🎙️ Ouvindo…</b><p>Ex.: “Quero ver meus amigos”.</p>')"><div class=mic>🎙️</div><div><b>Fale com o Vida Fácil!</b><span>Demonstração.</span></div></div><div class=item onclick="screen('friends')">“Quero ver meus amigos” → <b>Amigos</b></div><div class=item onclick="screen('recipes')">“Quero uma receita” → <b>Receitas</b></div><div class=item onclick="screen('activities')">“O que posso fazer hoje?” → <b>Atividades</b></div>`}
else if(s==='trust'){title('🛡️ Meus Contatos de Confiança');[['👩','Ana Paula','Filha • contato autorizado'],['👨','João Carlos','Filho • contato autorizado'],['👩','Maria José','Irmã • contato autorizado']].forEach(x=>M.innerHTML+=`<div class=item onclick="modal('<b>${x[1]}</b><p>${x[2]}</p><p>Exemplo: receber alerta do SOS quando autorizado.</p>')">${x[0]} <b>${x[1]}</b><span class=muted>${x[2]}</span></div>`);M.innerHTML+='<div class=item onclick="modal(\\'<b>➕ Adicionar contato</b><p>Exemplo: escolher pessoa e definir quais alertas ela recebe.</p>\\')">➕ <b>Adicionar contato</b></div>'}
else if(s==='settings'){title('⚙️ Configurações e Privacidade');[['🔐','Privacidade','Controle o que é compartilhado e com quem.'],['🔔','Notificações','Lembretes, mensagens e atividades.'],['👤','Minha conta','Maria Silva, 56 anos • Serra Talhada - PE'],['🔒','Segurança','Senha, proteção e permissões.'],['ℹ️','Sobre','Autonomia, inclusão, conexão e proteção.']].forEach(x=>M.innerHTML+=`<div class=item onclick="modal('<b>${x[0]} ${x[1]}</b><p>${x[2]}</p><p>Exemplo: abrir esta opção para consultar ou alterar a configuração.</p>')">${x[0]} <b>${x[1]}</b><span class=muted>${x[2]}</span></div>`)}
}
home();
</script></body></html>
