<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vida Fácil 50+</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eee;font-family:Arial;color:#30264a}.app{width:min(430px,100vw);min-height:100vh;margin:auto;background:#fff;padding-bottom:75px}header{background:linear-gradient(135deg,#7140bd,#a76ce4);color:#fff;padding:25px 20px;border-radius:0 0 28px 28px}.logo{font-size:25px;font-weight:800}.sub{font-size:13px;margin-top:4px}main{padding:18px 16px}.hello{font-size:21px;font-weight:700;margin-bottom:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card,.item{border:0;border-radius:18px;padding:16px;box-shadow:0 4px 14px #ddd;background:#faf8fd;cursor:pointer}.card{min-height:125px;text-align:left;font-weight:700}.card small{display:block;font-weight:400;margin-top:8px;line-height:1.3}.purple{background:#eee2ff}.orange{background:#fff0df}.green{background:#e4f8ed}.blue{background:#e5f0ff}.voice{margin:16px 0;background:#f5efff;border-radius:17px;padding:14px;display:flex;gap:10px;align-items:center;cursor:pointer}.mic{width:43px;height:43px;border-radius:50%;background:#7140bd;color:#fff;display:grid;place-items:center}.voice span,.muted{display:block;font-size:13px;color:#756a84;line-height:1.4}.section{font-size:21px;font-weight:800;margin-bottom:14px}.back{border:0;background:#eee2ff;color:#6339a0;padding:9px 13px;border-radius:12px;font-weight:700;cursor:pointer;margin-bottom:14px}.item{margin:10px 0}.item b{display:block;margin-bottom:5px}.pill{display:inline-block;background:#eee2ff;color:#6339a0;padding:5px 9px;border-radius:20px;font-size:11px;margin:3px}.sos{text-align:center;background:#fff0f0;border:2px solid #e35b65;border-radius:20px;padding:18px}.sos button{width:125px;height:125px;border-radius:50%;border:0;background:#e34f59;color:#fff;font-size:22px;font-weight:800;cursor:pointer}.bottom{position:fixed;bottom:0;width:min(430px,100vw);background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:9px 3px;z-index:4}.bottom button{border:0;background:none;color:#6c607b;font-size:11px;cursor:pointer}.bottom b{display:block;font-size:20px}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:9}.modalbox{width:min(430px,100vw);background:#fff;border-radius:24px 24px 0 0;padding:22px}.modalbox button{background:#7140bd;color:#fff;border:0;border-radius:12px;padding:12px 18px;font-weight:700}input{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;margin:6px 0}
</style></head><body><div class="app"><header><div class="logo">💜 Vida Fácil 50+</div><div class="sub">Tecnologia que conecta, orienta, protege e dá autonomia.</div></header><main id="main"></main>
<div class="bottom"><button onclick="home()">⌂<br>Início</button><button onclick="screen('community')">👥<br>Comunidade</button><button onclick="screen('learn')">🎓<br>Aprender</button><button onclick="screen('protection')">🆘<br>Proteção</button><button onclick="screen('settings')">⚙️<br>Ajustes</button></div></div>
<div class="modal" id="modal"><div class="modalbox"><div id="modalText"></div><br><button onclick="closeModal()">Fechar</button></div></div>
<script>
const M=document.getElementById('main');
function modal(t){modalText.innerHTML=t;document.getElementById('modal').style.display='flex'}function closeModal(){document.getElementById('modal').style.display='none'}function title(t){M.innerHTML='<button class="back" onclick="home()">← Voltar</button><div class="section">'+t+'</div>'}
function home(){M.innerHTML='<div class="hello">Olá, Maria! 👋</div><div class="grid"><button class="card purple" onclick="screen(\'life\')">🏠 Minha Vida<small>Remédios, consultas, documentos e mensagens.</small></button><button class="card orange" onclick="screen(\'community\')">🤝 Comunidade 50+<small>Grupos, amizades, histórias e atividades.</small></button><button class="card green" onclick="screen(\'learn\')">🎓 Aprenda Fácil<small>Aprenda tecnologia passo a passo.</small></button><button class="card blue" onclick="screen(\'protection\')">🆘 Modo Proteção<small>Peça ajuda rapidamente quando precisar.</small></button></div><div class="voice" onclick="screen(\'voice\')"><div class="mic">🎙️</div><div><b>Fale com o Vida Fácil</b><span>Ex.: “Meus lembretes de hoje”.</span></div></div><div class="item" onclick="screen(\'trust\')">🛡️ <b>Meus Contatos de Confiança</b><span class="muted">Pessoas escolhidas por você.</span></div><div class="item" onclick="screen(\'settings\')">🔐 <b>Privacidade e configurações</b><span class="muted">Dados, notificações e segurança.</span></div>'}
function screen(s){
if(s==='life'){title('🏠 Minha Vida');M.innerHTML+=`<div class="item" onclick="screen('reminders')">⏰ <b>Lembretes</b><span class="muted">Ex.: remédio às 08h e consulta sexta.</span></div><div class="item" onclick="modal('<b>📅 Compromissos</b><p>Hoje: caminhada às 17h.</p><p>Amanhã: mercado às 09h.</p>')">📅 <b>Compromissos</b><span class="muted">Caminhada, compras e aniversários.</span></div><div class="item" onclick="modal('<b>📄 Documentos</b><p>Ex.: RG, CPF, cartão do SUS e comprovantes.</p>')">📄 <b>Documentos</b><span class="muted">Organize referências importantes.</span></div><div class="item" onclick="modal('<b>💬 Mensagens</b><p>Ex.: explicar uma mensagem do WhatsApp em linguagem simples e ler em voz alta.</p>')">💬 <b>Ajuda com mensagens</b><span class="muted">Entenda textos com facilidade.</span></div>`}
else if(s==='reminders'){title('⏰ Lembretes');M.innerHTML+='<span class="pill">Todos</span><span class="pill">Remédios</span><span class="pill">Consultas</span><span class="pill">Compromissos</span><div class="item" onclick="modal(\'<b>08:00 — Vitamina</b><p>Lembrete pessoal configurado por Maria.</p>\')">💊 <b>08:00 — Vitamina</b><span class="muted">Lembrete.</span></div><div class="item" onclick="modal(\'<b>Sexta — 14:00</b><p>Consulta.</p><p>O app lembra o compromisso; não faz diagnóstico.</p>\')">🩺 <b>Sexta — 14:00</b><span class="muted">Consulta.</span></div>'}
else if(s==='community'){title('🤝 Comunidade 50+');M.innerHTML+='<input placeholder="🔎 Buscar grupos ou assuntos"><div class="item" onclick="screen(\'croche\')">🧶 <b>Crochê e Artesanato</b><span class="muted">1.248 participantes • novas publicações</span></div><div class="item" onclick="modal(\'<b>🌱 Jardinagem</b><p>Troca de mudas, horta e fotos de jardins.</p>\')">🌱 <b>Jardinagem</b><span class="muted">890 participantes</span></div><div class="item" onclick="modal(\'<b>🎵 Música</b><p>Compartilhe músicas, histórias e lembranças.</p>\')">🎵 <b>Música</b><span class="muted">654 participantes</span></div><div class="item" onclick="modal(\'<b>🍳 Culinária</b><p>Receitas de família e dicas de cozinha.</p>\')">🍳 <b>Culinária</b><span class="muted">1.102 participantes</span></div><div class="item" onclick="modal(\'<b>🏃 Movimento 50+</b><p>Caminhada, alongamento e atividades locais.</p>\')">🏃 <b>Movimento 50+</b><span class="muted">742 participantes</span></div><div class="item" onclick="modal(\'<b>📍 Perto de mim</b><p>Ex.: feira de artesanato, caminhada e encontro cultural.</p><p>Localização exata não é pública por padrão.</p>\')">📍 <b>Perto de mim</b><span class="muted">Atividades e encontros.</span></div>'}
else if(s==='croche'){title('🧶 Crochê e Artesanato');M.innerHTML+='<div class="item"><b>Maria Silva • Hoje, 10:20</b><p>Terminei minha bolsa de crochê! 🧶✨</p><span class="pill">❤️ 24</span><span class="pill">💬 8</span></div><div class="item" onclick="modal(\'<b>🎤 Publicar</b><p>Exemplo: escreva, grave um áudio ou compartilhe uma foto.</p>\')">🎤 <b>Falar / publicar</b><span class="muted">Texto ou voz.</span></div>'}
else if(s==='learn'){title('🎓 Aprenda Fácil');[['📱','WhatsApp','Enviar fotos, áudios e chamadas.'],['💳','Pix com segurança','Confira o destinatário antes de pagar.'],['🛒','Compras online','Verifique site, endereço e reputação.'],['⚠️','Evite golpes','Cuidado com urgência, links e pedidos de dinheiro.'],['📸','Usar a câmera','Tirar, editar e compartilhar fotos.']].forEach(x=>M.innerHTML+=`<div class="item" onclick="modal('<b>${x[0]} ${x[1]}</b><p>${x[2]}</p><p><b>Exemplo:</b> passo 1 → abrir; passo 2 → escolher; passo 3 → confirmar.</p>')">${x[0]} <b>${x[1]}</b><span class="muted">${x[2]}</span></div>`)}
else if(s==='protection'){title('🆘 Modo Proteção');M.innerHTML+='<div class="sos"><p><b>Proteção ativada somente quando você escolher.</b></p><button onclick="modal(\'<b>🚨 SOS acionado</b><p>Em uma situação real, o protocolo configurado alertaria os contatos autorizados.</p><p>Exemplo: alerta + horário + localização, somente se autorizado.</p>\')">SOS</button><p class="muted">Botão manual de emergência</p></div><div class="item" onclick="modal(\'<b>🎙️ Comando</b><p>“Socorro, preciso de ajuda!”</p><p>O app não fica ouvindo o tempo todo. O reconhecimento funciona quando o Modo Proteção está ativo, conforme permissões.</p>\')">🎙️ <b>Comando de emergência</b><span class="muted">Ativação por voz.</span></div><div class="item" onclick="screen(\'trust\')">👥 <b>Contatos autorizados</b><span class="muted">Escolha quem recebe alertas.</span></div>'}
else if(s==='voice'){title('🎙️ Assistente de Voz');M.innerHTML+='<div class="voice" onclick="modal(\'<b>🎙️ Ouvindo…</b><p>Ex.: “Abra meus lembretes”.</p>\')"><div class="mic">🎙️</div><div><b>Fale com o Vida Fácil!</b><span>Demonstração.</span></div></div><div class="item" onclick="screen(\'reminders\')">“Quais são meus lembretes?” → <b>Ver lembretes</b></div><div class="item" onclick="screen(\'learn\')">“Quero aprender WhatsApp” → <b>Abrir aula</b></div><div class="item" onclick="screen(\'community\')">“Quero conversar” → <b>Comunidade</b></div>'}
else if(s==='trust'){title('🛡️ Meus Contatos de Confiança');[['👩','Ana Paula','Filha'],['👨','João Carlos','Filho'],['👩','Maria José','Irmã']].forEach(x=>M.innerHTML+=`<div class="item" onclick="modal('<b>${x[1]}</b><p>${x[2]} • contato autorizado</p>')">${x[0]} <b>${x[1]}</b><span class="muted">${x[2]}</span></div>`);M.innerHTML+='<div class="item" onclick="modal(\'<b>➕ Adicionar contato</b><p>Exemplo: escolher a pessoa e quais alertas ela poderá receber.</p>\')">➕ <b>Adicionar contato</b></div>'}
else if(s==='settings'){title('⚙️ Configurações e Privacidade');[['🔐','Privacidade','Controle o que é compartilhado e com quem.'],['🔔','Notificações','Lembretes, mensagens e atividades.'],['👤','Minha conta','Maria Silva, 56 anos • Serra Talhada - PE'],['ℹ️','Sobre','Plataforma focada em autonomia, inclusão, conexão e proteção.']].forEach(x=>M.innerHTML+=`<div class="item" onclick="modal('<b>${x[0]} ${x[1]}</b><p>${x[2]}</p>')">${x[0]} <b>${x[1]}</b><span class="muted">${x[2]}</span></div>`)}
}
home();
</script></body></html>
